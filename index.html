<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juul_Listes-Compactes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    <style>
        :root {
            --bg: #eaecef;                 /* Fond d'écran global en version ordinateur */
            --app-bg: #f8f9fa;             /* Fond de l'application */
            --surface: #ffffff;            /* Fond des blocs de liste et d'inputs */
            --text: #212529;               /* Couleur principale du texte */
            --text-muted: #6c757d;         /* Pour les éléments secondaires (ex: les dates) */
            --border: #dee2e6;
            --primary: #0d6efd;
            --danger: #dc3545;
            --priority-bg: #fde8e8;        /* Rouge très clair pour le fond (mode clair) */
            --priority-border: #f8b4b4;    /* Bordure rouge douce */
            --priority-text: #9b1c1c;      /* Texte rouge foncé */
            --question-bg: #fef3c7;        /* Jaune clair pour les questions (mode clair) */
            --question-border: #fde68a;    /* Bordure jaune douce */
            --question-text: #92400e;      /* Texte jaune/ambre foncé */
            --shadow: rgba(0, 0, 0, 0.05);
        }
        .dark-theme {
            --bg: #121212;                 /* Fond d'écran extérieur sombre */
            --app-bg: #1a1a1a;             /* Fond de l'application sur PC */
            --surface: #242424;            /* Fond des listes pour créer du relief */
            --text: #f5f5f5;               /* Blanc cassé à fort contraste */
            --text-muted: #b0b0b0;         /* Gris clair parfaitement lisible sur fond noir */
            --border: #3d3d3d;
            --primary: #3b82f6;            /* Bleu plus électrique adapté au mode sombre */
            --danger: #f87171;
            --priority-bg: #3b1414;        /* Rouge brique très sombre pour le fond */
            --priority-border: #7f1d1d;    /* Bordure rouge foncé */
            --priority-text: #fca5a5;      /* Rouge pastel clair offrant un excellent contraste */
            --question-bg: #221c11;        /* Ambre/Marron très sombre et discret */
            --question-border: #3d301a;    /* Bordure ambre atténuée */
            --question-text: #cca43b;      /* Jaune or/moutarde mat, beaucoup moins agressif visuellement */
            --shadow: rgba(0, 0, 0, 0.4);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        
        .app-container {
            width: 100%;
            max-width: 650px;
            min-height: 100vh;
            background-color: var(--app-bg);
            box-shadow: 0 0 15px var(--shadow);
            box-sizing: border-box;
            padding: 8px 8px 12px 8px;
            display: flex;
            flex-direction: column;
        }
        
        .hidden { display: none !important; }
        
        .search-bar-container {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
        }
        .search-input-wrapper input {
            width: 100%;
            padding: 4px 26px 4px 6px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
        }
        .btn-action-header {
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            white-space: nowrap;
        }

        .list-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 8px; 
            padding: 6px 8px;   
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 4px; 
            border-bottom: 1px solid var(--border);
            padding-bottom: 3px;
        }
        .list-title-zone {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        .notes-dropzone {
            list-style: none;
            padding: 0;
            margin: 0;
            min-height: 20px;
        }
        
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--app-bg);
            border: 1px solid var(--border);
            padding: 3px 6px; 
            margin-bottom: 3px; 
            border-radius: 3px;
            color: var(--text);
        }
        
        .priority-high {
            background-color: var(--priority-bg) !important;
            border-color: var(--priority-border) !important;
            color: var(--priority-text) !important;
        }

        .note-question {
            background-color: var(--question-bg) !important;
            border-color: var(--question-border) !important;
            color: var(--question-text) !important;
        }
        
        .note-main {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .note-date {
            font-size: 9px; 
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 4px; 
        }
        .input-group input {
            flex-grow: 1;
            padding: 4px 6px; 
            border: 1px solid var(--border);
            border-radius: 3px 0 0 3px;
            background: var(--surface);
            color: var(--text);
        }
        .input-group button {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 3px 3px 0;
            background: var(--primary);
            color: #ffffff;
            font-weight: bold;
        }
        
        .collapsed { display: none !important; }
        .ghost-list { opacity: 0.4; background: #cbd5e1; }
        .ghost-note { opacity: 0.5; background: #94a3b8; }
        
        .control-panel-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .backup-alert {
            font-size: 11px;
            padding: 4px 8px;
            margin-bottom: 6px;
            background-color: #fff3cd;
            border: 1px solid #ffecb5;
            color: #856404;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .app-footer {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        button { cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">

        <div id="alert-container"></div>

        <div class="search-bar-container">
            <div class="search-input-wrapper">
                <input type="text" id="input-search" placeholder="🔍 Rechercher une note ou liste..." autocomplete="off">
                <button id="btn-clear-search" onclick="clearSearch()" class="hidden" style="position: absolute; right: 0; top: 0; bottom: 0; background: none; border: none; color: var(--text); opacity: 0.5; font-size: 14px; padding: 0 8px; z-index: 5;">✕</button>
            </div>
            <button id="btn-toggle-all" class="btn-action-header" onclick="toggleAllLists()">↕️ Replier</button>
            <button class="btn-action-header" onclick="toggleControlPanel()">⚙️ Menu</button>
        </div>

        <div id="control-panel" class="control-panel-box hidden">
            <form id="form-add-list" class="input-group">
                <input type="text" id="input-list-name" placeholder="Nom de la nouvelle liste..." required autocomplete="off">
                <button type="submit">Créer Liste</button>
            </form>
            <div style="margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap;">
                <button id="btn-theme" style="padding: 3px 6px;" onclick="toggleTheme()">🌓 Auto</button>
                <button style="padding: 3px 6px;" onclick="triggerImport()">📥 Importer</button>
                <button style="padding: 3px 6px;" onclick="exportData()">📤 Exporter</button>
                <button id="btn-reset" style="padding: 3px 6px; color: var(--danger)">🗑️ Reset Global</button>
                <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <div id="lists-container"></div>
        <div id="trash-container"></div>

        <footer class="app-footer">
            <div id="backup-timestamps"></div>
            <div id="storage-info"></div>
            <div class="app-version">Version 1.29.0</div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
