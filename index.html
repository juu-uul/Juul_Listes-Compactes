<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listes Compactes Pro</title>
    
    <!-- Liaison du Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #0056b3;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --gray-border: #dee2e6;
            --danger: #dc3545;
            --success: #28a745;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --warning-text: #856404;
            --priority-bg: #fff5f5;
            --priority-border: #ffc9c9;
        }

        /* --- THEME SOMBRE (ACTIVÉ PAR LA CLASSE CORRESPONDANTE) --- */
        body.dark-theme {
            --primary: #3b82f6;
            --background: #121212;
            --surface: #1e1e1e;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --gray-border: #374151;
            --danger: #ef4444;
            --success: #10b981;
            --warning-bg: #2e2510;
            --warning-border: #4d3d19;
            --warning-text: #f59e0b;
            --priority-bg: #2d1919;
            --priority-border: #4c1d1d;
        }
        
        body.dark-theme input[type="text"] {
            background-color: #2d2d2d;
            color: var(--text);
            border-color: var(--gray-border) !important;
        }
        body.dark-theme .list-header {
            background: #2d2d2d !important;
        }
        body.dark-theme .trash-header {
            background: #3f2225 !important;
        }
        body.dark-theme .trash-block {
            border-color: #5a2a2d !important;
        }
        body.dark-theme .ghost-list, body.dark-theme .ghost-note {
            background: #1e3a8a !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 5px;
            font-size: 13px;
        }

        /* --- BARRE DE RECHERCHE FIXE ET OUTILS --- */
        .search-top-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            align-items: center;
        }
        .search-container {
            display: flex;
            flex: 1;
        }
        .search-input {
            width: 100%;
            padding: 4px 8px;
            font-size: 12px;
            border: 1px solid var(--gray-border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
        }
        .btn-mini {
            background: none;
            color: var(--text-muted);
            border: 1px dashed var(--gray-border);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-mini:hover {
            background: var(--surface);
            color: var(--primary);
        }

        /* --- PANNEAU DE CONTRÔLE PLIABLE --- */
        .control-panel {
            display: block;
        }
        .control-panel.hidden {
            display: none;
        }

        .card {
            background: var(--surface);
            padding: 6px 8px;
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            margin-bottom: 6px;
        }
        
        .backup-alert {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .input-group {
            display: flex;
            gap: 5px;
            flex: 1;
        }
        .backup-group {
            display: flex;
            gap: 4px;
        }
        input[type="text"] {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid var(--gray-border);
            border-radius: 3px;
            font-size: 13px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        button:hover { opacity: 0.9; }
        
        .btn-secondary { background-color: #6c757d; }
        .btn-success { background-color: var(--success); }
        .btn-theme-toggle { background-color: #6c757d; padding: 4px 8px; }
        
        /* Listes */
        .list-block {
            background: var(--surface);
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: #f1f3f5;
            cursor: grab;
            user-select: none;
        }
        .list-title-zone {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .list-title-input, .note-title-input {
            font-family: inherit;
            font-size: 13px;
            padding: 1px 4px;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 2px;
        }
        .list-title-input { font-weight: 600; }
        .note-title-input { width: 90%; font-size: 13px; margin: 2px 0; }
        
        .btn-toggle {
            background: none;
            color: var(--text-muted);
            padding: 2px 5px;
        }
        
        .list-content {
            padding: 6px;
            border-top: 1px solid var(--gray-border);
        }
        .list-content.collapsed { display: none; }
        
        /* Notes standard */
        ul.notes-dropzone {
            list-style: none;
            padding: 0;
            margin: 4px 0 0 0;
            min-height: 20px;
        }
        li.note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--gray-border);
            padding: 3px 6px;
            margin-bottom: 3px;
            border-radius: 3px;
            border-left: 3px solid var(--primary);
            cursor: grab;
        }
        
        li.note-item.priority-high {
            border-left-color: var(--danger);
            background-color: var(--priority-bg);
            border-top-color: var(--priority-border);
            border-right-color: var(--priority-border);
            border-bottom-color: var(--priority-border);
        }

        .note-main {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            cursor: pointer;
        }
        .note-date {
            font-size: 10px;
            color: var(--text-muted);
            user-select: none;
        }
        
        /* Corbeille */
        .trash-block { border-color: #f5c6cb; margin-top: 20px; }
        .trash-header { background: #f8d7da; }
        .trash-item { border-left-color: var(--danger); }
        .trash-item .note-main { cursor: default; }

        .ghost-list { opacity: 0.3; background: #e7f5ff; }
        .ghost-note { opacity: 0.4; background: #e7f5ff; }
        .delete-btn { background-color: var(--danger); padding: 1px 5px; font-size: 11px; }
        .btn-restore { background-color: #28a745; padding: 1px 5px; font-size: 11px; margin-right: 3px; }

        footer {
            margin-top: 20px;
            padding: 6px 0;
            border-top: 1px dashed var(--gray-border);
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="search-top-bar">
        <div class="search-container">
            <input type="text" id="input-search" class="search-input" placeholder="🔍 Filtrer les tâches ou listes..." autocomplete="off">
        </div>
        <button id="btn-toggle-panel" class="btn-mini" onclick="toggleControlPanel()">⚙️ Configuration</button>
    </div>

    <div id="alert-container"></div>

    <div id="control-panel" class="control-panel hidden">
        <div class="card">
            <div class="header-actions">
                <form id="form-add-list" class="input-group">
                    <input type="text" id="input-list-name" placeholder="Nouvelle liste..." required autocomplete="off">
                    <button type="submit">+ Liste</button>
                </form>
                
                <div class="backup-group">
                    <button id="btn-theme" onclick="toggleTheme()" class="btn-theme-toggle" title="Changer de thème">🌓 Mode</button>
                    <button onclick="exportData()" class="btn-secondary" title="Exporter les données en JSON">↑ Exp</button>
                    <button onclick="triggerImport()" class="btn-success" title="Importer un fichier JSON">↓ Imp</button>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="importData(event)">
                </div>
            </div>
        </div>
    </div>

    <div id="lists-container"></div>
    <div id="trash-container"></div>

    <footer>
        <div id="backup-timestamps">Dernier export : jamais | Dernier import : jamais</div>
        <button id="btn-reset" class="btn-secondary" style="opacity: 0.6; padding: 2px 6px;">Remettre à zéro</button>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
