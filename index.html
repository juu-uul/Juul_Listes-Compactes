<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juul_Listes-Compactes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    <style>
        :root {
            --bg: #eaecef;
            --app-bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --primary: #0d6efd;
            --danger: #dc3545;
            --priority-bg: #fde8e8;
            --priority-border: #f8b4b4;
            --priority-text: #9b1c1c;
            --question-bg: #fef3c7;
            --question-border: #fde68a;
            --question-text: #92400e;
            --shadow: rgba(0, 0, 0, 0.05);
            /* Indicateurs Cloud v2.7.0 */
            --sync-success: #198754;
            --sync-warning: #f59e0b;
            --sync-danger: #dc3545;
        }
        .dark-theme {
            --bg: #121212;
            --app-bg: #1e1e2e;
            --surface: #2b2d42;
            --text: #e9ecef;
            --border: #495057;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        /* ... reste du CSS ... */
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
