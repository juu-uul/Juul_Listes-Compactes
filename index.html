<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juul_Listes-Compactes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    <style>
        :root {
            --bg: #eaecef;
            --app-bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --primary: #0d6efd;
            --danger: #dc3545;
            --priority-bg: #fde8e8;
            --priority-border: #f8b4b4;
            --priority-text: #9b1c1c;
            --question-bg: #fef3c7;
            --question-border: #fde68a;
            --question-text: #92400e;
            --shadow: rgba(0, 0, 0, 0.05);
            --sync-success: #198754;
            --sync-warning: #f59e0b;
            --sync-danger: #dc3545;
        }
        .dark-theme {
            --bg: #1e1e2e;
            --app-bg: #181825;
            --surface: #252538;
            --text: #cdd6f4;
            --text-muted: #a6adc8;
            --border: #45475a;
            --primary: #89b4fa;
            --danger: #f38ba8;
            --priority-bg: #585b70;
            --priority-border: #f38ba8;
            --priority-text: #f38ba8;
            --question-bg: #45475a;
            --question-border: #f9e2af;
            --question-text: #f9e2af;
            --shadow: rgba(0, 0, 0, 0.3);
            --sync-success: #4ade80;
            --sync-warning: #fbbf24;
            --sync-danger: #f87171;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 60px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--app-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px var(--shadow);
            padding: 15px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.4rem; margin: 0; font-weight: 700; }

        .btn-icon {
            background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text); padding: 5px;
        }

        .config-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .config-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
        }

        .config-group label {
            font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; color: var(--text-muted);
        }

        .config-group input {
            background: var(--app-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .form-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .form-row input {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            color: var(--text); padding: 8px; border-radius: 4px; font-size: 0.9rem;
        }
        .form-row button {
            background: var(--primary); color: white; border: none; padding: 8px 15px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        /* Bulle de synchro flottante v3.3.1 */
        .sync-bubble {
            position: fixed; bottom: 20px; right: 20px; z-index: 999;
            background: var(--surface); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 30px; display: flex; align-items: center;
            gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 0.85rem; font-weight: bold;
        }
        .sync-bubble button {
            background: none; border: none; cursor: pointer; font-size: 1rem; animation: none; padding: 0; margin: 0;
        }

        .sync-warning {
            animation: pulse 2s infinite;
            border: 2px solid var(--sync-warning) !important;
            background-color: rgba(245, 158, 11, 0.15) !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* Modale de conflit */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--surface); padding: 20px; border-radius: 8px; max-width: 90%; width: 450px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Juul_Listes</h1>
            <div>
                <button id="btn-toggle-all" class="btn-icon" title="Tout réduire/développer">↔️</button>
                <button id="btn-theme" class="btn-icon" title="Changer de thème">🌓</button>
                <button id="btn-reset" class="btn-icon" title="Réinitialiser l'application">⚠️</button>
            </div>
        </header>

        <div class="config-panel">
            <div class="config-group">
                <label>URL Google Apps Script</label>
                <input type="url" id="input-cloud-url" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div class="config-group">
                <label>Clé Secrète</label>
                <input type="password" id="input-cloud-secret" placeholder="Votre phrase secrète">
            </div>
            <div class="config-group">
                <label>Nom de cet appareil</label>
                <input type="text" id="input-cloud-device" placeholder="Ex: PC-Bureau, Smartphone">
            </div>
            <div class="config-group">
                <label>Rappel d'inactivité avant pulsation (minutes)</label>
                <input type="number" id="input-sync-interval" min="1" max="1440" value="30">
            </div>
        </div>

        <div class="form-row">
            <input type="text" id="input-search" placeholder="Rechercher une note ou tâche...">
            <button id="btn-clear-search" class="btn-icon hidden">❌</button>
        </div>

        <form id="form-add-list" class="form-row">
            <input type="text" id="input-list-name" placeholder="Créer une nouvelle liste..." required>
            <button type="submit">Créer</button>
        </form>

        <div id="lists-container"></div>
        <div id="trash-container"></div>
        <div id="storage-info" style="font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 10px;"></div>
    </div>

    <div class="sync-bubble" id="sync-status-container">
        <span id="sync-status-text">☁️ Non configuré</span>
        <button id="btn-sync" title="Forcer la synchronisation maintenant">🔄</button>
    </div>

    <div id="modal-conflit" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: var(--sync-warning);">⚠️ Conflit de Synchronisation</h3>
            <p style="font-size: 0.9rem; var(--text-muted);">Des modifications concurrentes ont été détectées sur un autre appareil.</p>
            
            <table style="width:100%; font-size:0.8rem; border-collapse: collapse; margin-bottom: 20px; border: 1px solid var(--border);">
                <thead>
                    <tr style="background: var(--bg);">
                        <th style="padding: 6px; text-align: left;">Indicateur</th>
                        <th style="padding: 6px; text-align: left;">Local (Cet appareil)</th>
                        <th style="padding: 6px; text-align: left;">Cloud (Serveur)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr style="border-bottom: 1px solid var(--border);">
                        <td style="padding: 6px 4px; font-weight: bold;">Appareil</td>
                        <td id="conflict-local-device">-</td>
                        <td id="conflict-cloud-device">-</td>
                    </tr>
                    <tr style="border-bottom: 1px solid var(--border);">
                        <td style="padding: 6px 4px; font-weight: bold;">Date modification</td>
                        <td id="conflict-local-date">-</td>
                        <td id="conflict-cloud-date">-</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px 4px; font-weight: bold;">Volume data</td>
                        <td id="conflict-local-volume">-</td>
                        <td id="conflict-cloud-volume">-</td>
                    </tr>
                </tbody>
            </table>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="btn-resolve-merge" style="background: #0dcaf0; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    🔵 Fusionner les deux versions (Recommandé / Sans perte)
                </button>
                <button id="btn-resolve-accept-cloud" style="background: var(--primary); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    🟢 Télécharger la version Cloud (Écrase cet appareil)
                </button>
                <button id="btn-resolve-force-local" style="background: none; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    🟠 Écraser le Cloud avec ma version Locale
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
